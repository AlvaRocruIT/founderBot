</head>
  
<body>
  <div class="page">
    <section class="hero">
    <h1 class="hero-title">
  <span class="line">Prepárate <br></span>
  <span class="line">para postular a tu próxima <br><span id="dynamic-text"></span><span class="cursor">|</span></span>
</h1>
      <p class="subtitle">
        Sabemos que emprender es dificil,<br> pero nadie dijo por qué tenía que serlo.🚀<br>
      </p>  

    <h2>Fondos concursables al alcance de un chat</h2>
    <div class="button-container">
      <button id="Talca" onclick="location.href='StartupChile/index.html'">Startup Chile</button>
      <button id="LasCondes" onclick="location.href='IniciaLosLagos/index.html'">Semilla Inicia | Los Lagos</button>
      <button id="Digital" onclick="location.href='IniciaLosRios/index.html'">Semilla Inicia | Los Ríos</button>
    </div>
  </div>
  <script src="main.js"></script>

  <script id="cursor-track">
document.querySelectorAll(".button-container button").forEach(btn => {
  btn.addEventListener("mousemove", e => {
    const rect = btn.getBoundingClientRect();
    const x = ((e.clientX - rect.left) / rect.width) * 100;
    const y = ((e.clientY - rect.top) / rect.height) * 100;

    btn.style.setProperty("--x", x + "%");
    btn.style.setProperty("--y", y + "%");
  });
});
</script>
</body>
